<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Make a No More meme with Brave Image Search.">
    <title>No More Meme Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main>
      <h1>NO MORE GENERATOR</h1>
      <p class="subtitle">Make a no more meme. You can edit the part after the / in the URL also.</p>
      <form id="generator">
        <label class="sr-only" for="word">Word or phrase</label>
        <input id="word" maxlength="80" placeholder="Text here" autocomplete="off" required>
        <button type="submit">Generate!</button>
      </form>
      <p id="status" aria-live="polite"></p>
      <section id="result" hidden>
        <img id="output" alt="Your No More meme">
        <a id="download" download="no-more-meme.jpg">Download meme</a>
      </section>
      <div class="divider"></div>
      <section class="tips">
        <h2>TIPS:</h2>
        <p>You can use an underscore for a space.</p>
        <p>Your word or phrase goes on the bottom and is sized to fit.</p>
        <p>You can append '?q=your_search_here' to get an image different from the text.</p>
      </section>
    </main>
    <script>
      const form = document.querySelector('#generator');
      const word = document.querySelector('#word');
      const status = document.querySelector('#status');
      const result = document.querySelector('#result');
      const output = document.querySelector('#output');
      const download = document.querySelector('#download');
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const text = word.value.trim();
        if (!text) return;
        status.textContent = 'Find an image...';
        result.hidden = true;
        try {
          const memePath = encodeURIComponent(text).replace(/%20/g, '_');
          const response = await fetch(`/${memePath}`);
          if (!response.ok) throw new Error((await response.json()).error);
          const url = URL.createObjectURL(await response.blob());
          output.src = url;
          download.href = url;
          status.textContent = '';
          result.hidden = false;
        } catch (error) {
          status.textContent = error.message || 'Could not make that meme.';
        }
      });
    </script>
  </body>
</html>
